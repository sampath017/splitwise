{% extends 'expense_splitter/base.html' %}

{% block title %}Edit Expense | {{ block.super }}{% endblock %}

{% block content %}
<h1>Edit Expense</h1>
<h4>Trip: {{ trip.name }}</h4>

<form method="post" class="mt-4">
    {% csrf_token %}
    
    <div class="mb-3">
        <label for="{{ form.description.id_for_label }}" class="form-label">Description</label>
        {{ form.description }}
    </div>
    
    <div class="mb-3">
        <label for="{{ form.amount.id_for_label }}" class="form-label">Amount</label>
        {{ form.amount }}
    </div>
    
    <div class="mb-3">
        <label for="{{ form.paid_by.id_for_label }}" class="form-label">Paid By</label>
        {{ form.paid_by }}
    </div>
    
    <div class="mb-3">
        <label for="{{ form.date.id_for_label }}" class="form-label">Date</label>
        {{ form.date }}
    </div>
    
    <div class="mb-3">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'trip_detail' trip.id %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
