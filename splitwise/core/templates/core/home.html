{% extends 'expense_splitter/base.html' %}

{% block content %}
<h1>My Trips</h1>

{% if trips %}
    <div class="list-group mt-4">
    {% for trip in trips %}
        <a href="{% url 'trip_detail' trip.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            {{ trip.name }}
            <span class="badge bg-primary rounded-pill">{{ trip.participants.count }} people</span>
        </a>
    {% endfor %}
    </div>
{% else %}
    <p>No trips yet. <a href="{% url 'create_trip' %}">Create your first trip!</a></p>
{% endif %}

<div class="mt-4">
    <a href="{% url 'create_trip' %}" class="btn btn-primary">Create New Trip</a>
</div>
{% endblock %}
