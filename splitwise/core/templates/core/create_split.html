{% extends 'expense_splitter/base.html' %}

{% block title %}Create New Split | {{ block.super }}{% endblock %}

{% block content %}
<h1>Create New Split</h1>

<form method="post" class="mt-4">
    {% csrf_token %}
    
    <div class="mb-3">
        <label for="{{ form.name.id_for_label }}" class="form-label">Split Name</label>
        {{ form.name }}
    </div>
    
    <button type="submit" class="btn btn-primary">Create Split</button>
</form>
{% endblock %}
